name: Sync upstream

# Merges each new upstream release into main and tags it; the tag push starts
# fork-release.yml, which publishes the fork release. Pushing uses SYNC_TOKEN
# (the owner's gh token): upstream commits regularly touch .github/workflows,
# which the default token may not push, and a tag pushed by the default token
# would not start another workflow.
# A conflict fails the run once, with the reason in its summary, and is kept
# in the SYNC_PENDING variable so the following daily runs stay quiet until
# main contains that release or a newer one shows up. Nothing is force-pushed.
# Issues are disabled on this fork, so the failed run is the alert.

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Merge the latest upstream release
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PENDING: ${{ vars.SYNC_PENDING }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/CodeZeno/Claude-Code-Usage-Monitor.git
          git fetch upstream --tags --force

          utag=$(git tag --merged upstream/main --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)
          echo "Latest upstream release: $utag"
          if git merge-base --is-ancestor "$utag" HEAD; then
            echo "Already on $utag, nothing to do."
            if [ -n "$PENDING" ]; then gh variable delete SYNC_PENDING; fi
            exit 0
          fi

          report() {
            printf '## Sync with upstream %s needs attention\n\n%s\n' "$utag" "$1" >> "$GITHUB_STEP_SUMMARY"
          }
          fail() {
            report "$1"
            echo "::error title=Sync with upstream $utag needs attention::$(printf '%s' "$1" | head -n1)"
            exit 1
          }

          if ! git merge --no-edit "$utag"; then
            # The fork replaces upstream's release workflow; keep it deleted.
            if git status --porcelain | grep -q '^.. .github/workflows/release.yml$'; then
              git rm -q .github/workflows/release.yml || true
            fi
            if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
              files=$(git diff --name-only --diff-filter=U | sed 's/^/- /')
              git merge --abort
              message="Merging upstream $utag into main conflicts in:"$'\n'"$files"$'\n\n'"Resolve locally: \`git fetch upstream --tags && git merge $utag\`, then push main and tag it."
              if [ "$PENDING" = "$utag" ]; then
                report "$message"
                echo "::warning title=Sync with upstream $utag still pending::Reported by an earlier run; this one stays quiet."
                exit 0
              fi
              gh variable set SYNC_PENDING --body "$utag"
              fail "$message"
            fi
            git commit --no-edit
          fi

          # Same version as upstream, tag without the "v" (see fork-release.yml).
          tag="${utag#v}"
          git tag "$tag"
          if ! git push --atomic origin HEAD:main "$tag"; then
            fail "Upstream $utag merged cleanly but the push was refused. If SYNC_TOKEN was revoked (a new \`gh auth login\` issues another token), set it again with \`gh auth token | gh secret set SYNC_TOKEN -R $GH_REPO\`."
          fi
          if [ -n "$PENDING" ]; then gh variable delete SYNC_PENDING; fi
