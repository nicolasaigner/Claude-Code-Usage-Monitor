name: Fork release

# Builds and publishes the fork's binary. The in-app updater reads the latest
# release of the repository named in Cargo.toml and compares its tag with the
# running version, so a fork release carries upstream's own version with the
# tag written without the "v" (e.g. 2.14.55): the updater accepts both forms,
# and the name never collides with upstream's v2.14.55 tag.
# A longer version (such as 2.14.5501) would not fit the Studio footer.

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_ASSET_NAME: claude-code-usage-monitor.exe

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Check the tag matches Cargo.toml
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          $version = ([regex]'(?m)^version = "([^"]+)"').Match((Get-Content Cargo.toml -Raw)).Groups[1].Value
          if ($tag -ne $version) { throw "Tag $tag does not match Cargo.toml version $version." }
          "TAG=$tag" >> $env:GITHUB_ENV

      - name: Test
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: target/release/${{ env.RELEASE_ASSET_NAME }}
          generate_release_notes: true
          make_latest: true
